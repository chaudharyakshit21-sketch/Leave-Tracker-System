<template>
    <div class="slds-grid slds-wrap slds-gutters">
        <template if:true={hasBalances}>
            <template for:each={balances} for:item="item">
                <div key={item.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                    <div class="balance-tile slds-box slds-theme_default">
                        <p class="slds-text-title_caps slds-text-color_weak">{item.Leave_Type__c}</p>
                        <p class="slds-text-heading_large">{item.Remaining_Days__c}
                            <span class="slds-text-body_small slds-text-color_weak"> of {item.Total_Days__c} days left</span>
                        </p>
                        <lightning-progress-bar value={item.usedPercent} size="medium"></lightning-progress-bar>
                    </div>
                </div>
            </template>
        </template>
        <template if:true={noBalances}>
            <div class="slds-col slds-size_1-of-1">
                <div class="slds-box slds-theme_shade">No leave balances are configured for this year yet.</div>
            </div>
        </template>
        <template if:true={error}>
            <div class="slds-col slds-size_1-of-1">
                <div class="slds-text-color_error">{error}</div>
            </div>
        </template>
    </div>
</template>
